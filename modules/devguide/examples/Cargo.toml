[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
couchbase = { git = "https://github.com/couchbaselabs/couchbase-rs/", branch = "main" }
env_logger = "0.11"
serde_json = "^1.0"
tokio = "1.47"
uuid = { version = "1.18.1", features = ["v4"] }
futures-util = "0.3.31"
futures = "0.3.31"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.3"
serde = { version = "1.0.225", features = ["derive"] }
rmp-serde = "1.3.0"
